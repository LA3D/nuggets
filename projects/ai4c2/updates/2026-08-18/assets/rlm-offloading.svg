<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 350" role="img" aria-labelledby="title desc">
  <title id="title">Context offloading and programmatic subcalls in an RLM</title>
  <desc id="desc">A standard agent appends task-specific context and tool results to its root history, while an RLM stores context and intermediate results in a REPL workspace and gives the root model only bounded observations and programmatic handles.</desc>
  <defs>
    <style>.t{fill:#1a1e28;font:600 17px ui-serif,"Iowan Old Style",Palatino,Georgia,serif}.s{fill:#5a6273;font:10.5px ui-monospace,"SF Mono",Menlo,Consolas,monospace}.e{fill:#8891a1;font:11px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.08em}.c{fill:#1f8272;font:11px ui-monospace,"SF Mono",Menlo,Consolas,monospace}</style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8891a1"/></marker>
    <marker id="ta" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f8272"/></marker>
  </defs>
  <text x="34" y="28" class="e">APPENDED-CONTEXT AGENT</text><text x="562" y="28" class="e">RECURSIVE LANGUAGE MODEL</text>
  <rect x="34" y="48" width="444" height="270" rx="16" fill="none" stroke="#d4d9e2"/>
  <rect x="562" y="48" width="444" height="270" rx="16" fill="none" stroke="#1f8272"/>
  <rect x="76" y="82" width="166" height="74" rx="11" fill="#fff" stroke="rgba(185,121,26,.45)"/><text x="159" y="111" text-anchor="middle" class="t">Root model</text><text x="159" y="134" text-anchor="middle" class="s">full task prefix</text>
  <rect x="286" y="74" width="150" height="176" rx="11" fill="#e6e9ef" stroke="#d4d9e2"/><text x="361" y="100" text-anchor="middle" class="t">Growing history</text><text x="361" y="127" text-anchor="middle" class="s">query + documents</text><text x="361" y="150" text-anchor="middle" class="s">tool result 1</text><text x="361" y="173" text-anchor="middle" class="s">reasoning</text><text x="361" y="196" text-anchor="middle" class="s">tool result 2</text><text x="361" y="225" text-anchor="middle" class="e">CONTEXT BLOAT</text>
  <path d="M242,119 L286,119" fill="none" stroke="#8891a1" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M361,250 C361,286 159,288 159,168" fill="none" stroke="#8891a1" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="594" y="82" width="166" height="74" rx="11" fill="#fff" stroke="rgba(185,121,26,.45)"/><text x="677" y="111" text-anchor="middle" class="t">Root model</text><text x="677" y="134" text-anchor="middle" class="s">strategy + handles</text>
  <rect x="806" y="70" width="166" height="198" rx="11" fill="rgba(31,130,114,.1)" stroke="#1f8272"/><text x="889" y="98" text-anchor="middle" class="t">REPL workspace</text><text x="889" y="126" text-anchor="middle" class="c">context = …</text><text x="889" y="149" text-anchor="middle" class="c">chunks = search(…)</text><text x="889" y="172" text-anchor="middle" class="c">r1 = llm(chunks[0])</text><text x="889" y="195" text-anchor="middle" class="c">r2 = llm(chunks[1])</text><text x="889" y="218" text-anchor="middle" class="c">answer = combine(r1,r2)</text><text x="889" y="246" text-anchor="middle" class="e">SYMBOLIC STATE</text>
  <path d="M760,119 L806,119" fill="none" stroke="#1f8272" stroke-width="1.5" marker-end="url(#ta)"/>
  <path d="M806,242 C766,282 677,282 677,168" fill="none" stroke="#1f8272" stroke-width="1.5" marker-end="url(#ta)"/>
  <text x="677" y="299" text-anchor="middle" class="s">bounded observations return</text>
  <text x="256" y="342" text-anchor="middle" class="e">PAYLOAD ACCUMULATES IN ROOT CONTEXT</text><text x="784" y="342" text-anchor="middle" class="e">PAYLOAD MOVES THROUGH VARIABLES AND SUBCALLS</text>
</svg>
