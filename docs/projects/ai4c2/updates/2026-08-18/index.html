</style><style>body{background:#eef0f4!important}</style></head><body><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="1" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-class="title" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" class="title" data-marpit-pagination="1" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--class:title;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23"><div class="eyebrow">AI4C2 · research foundations</div>
<h1 id="beyond-the-model">Beyond the Model</h1>
<p class="subtitle">Harnesses and Architectures for Language Agents</p>
<div class="meta">
Charles F. Vardeman II<br />
Center for Research Computing, University of Notre Dame<br />
August 18, 2026
</div>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="2" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">Language models</div>
<h2 id="an-llm-predicts-a-continuation">An LLM predicts a continuation</h2>
<p class="lede">A large language model maps the tokens already in its context to probabilities for what token should come next.</p>
<div class="grid three">
  <div class="card"><h3>Context</h3><p>Instructions, examples, retrieved information, and the conversation so far.</p></div>
  <div class="card amber-border"><h3>Model</h3><p>A trained neural network transforms that context into a distribution over tokens.</p></div>
  <div class="card teal"><h3>Continuation</h3><p>Sampling one token at a time produces text—and can request structured tool calls.</p></div>
</div>
<p class="microcopy">Introduction: <a href="https://youtu.be/7xTGNNLPyMI">Andrej Karpathy, “Deep Dive into LLMs like ChatGPT.”</a></p>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="3" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">Tool anatomy</div>
<h2 id="a-tool-connects-language-to-an-ordinary-function">A tool connects language to an ordinary function</h2>
<p class="lede">The model is shown a machine-readable contract. The harness connects that contract to executable code.</p>
<div class="contract-cols">
  <div>
    <pre><code><span class="code-key">name:</span> search_reports
<span class="code-key">description:</span> Find relevant reports
<span class="code-key">input_schema:</span>
  <span class="code-key">query:</span>  <span class="code-type">string</span>
  <span class="code-key">limit:</span>  <span class="code-type">integer</span>
<p><span class="code-comment"># bound by the harness to:</span><br />
<span class="code-key">implementation:</span> search_reports(query, limit)</code></pre><br />
<p class="microcopy">The contract enters model context; the implementation remains outside the model.</p></p>
  </div>
  <ul class="clean-list">
    <li class="teal-dot"><strong>Language-facing contract</strong><br /><span>Name, purpose, arguments, types, and constraints create a vocabulary for requesting action.</span></li>
    <li><strong>Harness binding</strong><br /><span>Maps the advertised name to Python, JavaScript, a database query, a command, or an API.</span></li>
    <li class="amber-dot"><strong>Structured boundary</strong><br /><span>Arguments and results cross as data—not as unconstrained executable prose.</span></li>
  </ul>
</div>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="4" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">Tool execution</div>
<h2 id="the-model-requests-an-action-the-harness-executes-it">The model requests an action; the harness executes it</h2>
<img class="tool-map-image" src="assets/tool-execution.svg" alt="A language model emits a structured tool call; the harness validates and invokes an ordinary software function, then returns the result as context" />
<p class="microcopy">The LLM proposes the call. The harness mediates every crossing of the language–software boundary.</p>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="5" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">From generation to action</div>
<h2 id="an-agent-puts-tools-in-a-loop">An agent puts tools in a loop</h2>
<p class="lede">“An LLM agent runs tools in a loop to achieve a goal.”</p>
<div class="grid three">
  <div class="card amber-border"><h3>1 · Goal</h3><p>A bounded objective and a condition for stopping.</p></div>
  <div class="card"><h3>2 · Tools</h3><p>Actions that retrieve information or change an external environment.</p></div>
  <div class="card teal"><h3>3 · Feedback</h3><p>Tool results return as observations that shape the next model call.</p></div>
</div>
<p class="microcopy">Definition: <a href="https://simonwillison.net/2025/Sep/18/agents/">Simon Willison, “I think ‘agent’ may finally have a widely enough agreed upon definition.”</a></p>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="6" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">From model to system</div>
<h2 id="capability-is-moving-outward">Capability is moving outward</h2>
<img class="architecture-image" src="assets/externalization-layers.svg" alt="Three layered stages of language-agent capability: model weights, assembled context, and harness infrastructure" />
<p class="microcopy">Adapted from <a href="https://arxiv.org/html/2604.08224v1">Zhou et al., “Externalization in LLM Agents,” Fig. 2 and §2.</a></p>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="7" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">Externalization</div>
<h2 id="reliable-agency-relocates-recurring-burdens">Reliable agency relocates recurring burdens</h2>
<div class="grid three">
  <div class="card teal"><span class="tag teal-tag">Memory</span><h3>Recall → recognition</h3><p>Persist state outside the model and retrieve what the present decision needs.</p></div>
  <div class="card amber-border"><span class="tag amber">Skills</span><h3>Generation → composition</h3><p>Package procedures so workflows need not be improvised from scratch.</p></div>
  <div class="card rose"><span class="tag rose-tag">Protocols</span><h3>Ad hoc → structured</h3><p>Turn ambiguous interaction into machine-readable, governable exchange.</p></div>
</div>
<p class="microcopy">Organizing principle: <a href="https://arxiv.org/html/2604.08224v1">Zhou et al., “Externalization in LLM Agents,” §1.</a></p>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="8" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">Externalized state</div>
<h2 id="memory-carries-continuity-across-time">Memory carries continuity across time</h2>
<div class="grid four">
  <div class="card"><h3>Working context</h3><p>Plans, open files, hypotheses, and checkpoints for the active task.</p></div>
  <div class="card teal"><h3>Episodic experience</h3><p>Prior trajectories, decisions, failures, outcomes, and reflections.</p></div>
  <div class="card amber-border"><h3>Semantic knowledge</h3><p>Stable facts, project conventions, abstractions, and domain guidance.</p></div>
  <div class="card rose"><h3>Personalized memory</h3><p>User- or environment-specific preferences with distinct retention rules.</p></div>
</div>
<p class="microcopy">Sources: <a href="https://arxiv.org/html/2604.08224v1#S3">Zhou et al., §3 and Fig. 4</a> · <a href="https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents">Anthropic, “Effective context engineering for AI agents.”</a></p>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="9" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">Externalized expertise</div>
<h2 id="skills-make-procedures-reusable-and-inspectable">Skills make procedures reusable and inspectable</h2>
<div class="grid three">
  <div class="card amber-border"><h3>Operational procedure</h3><p>Steps, dependencies, recovery paths, and stopping conditions.</p></div>
  <div class="card"><h3>Decision heuristics</h3><p>Rules for choosing tools, strategies, or branches under recurring conditions.</p></div>
  <div class="card teal"><h3>Normative constraints</h3><p>Required checks, prohibited actions, quality standards, and escalation rules.</p></div>
</div>
<div class="tag-row skill-paths"><span class="tag">authored</span><span class="tag teal-tag">distilled</span><span class="tag amber">discovered</span><span class="tag rose-tag">composed</span><span class="path-arrow">→ registry → progressive disclosure → execution</span></div>
<p class="microcopy">Source: <a href="https://arxiv.org/html/2604.08224v1#S4">Zhou et al., §4 and Fig. 5.</a></p>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="10" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">Externalized interaction</div>
<h2 id="protocols-govern-how-capabilities-cross-boundaries">Protocols govern how capabilities cross boundaries</h2>
<div class="grid four">
  <div class="card teal"><h3>Invocation grammar</h3><p>Arguments, types, ordering, result shape, and validation.</p></div>
  <div class="card"><h3>Lifecycle semantics</h3><p>Allowed transitions, turn ownership, completion, and failure.</p></div>
  <div class="card rose"><h3>Permission and trust</h3><p>Who may act, what data may move, and which evidence is required.</p></div>
  <div class="card amber-border"><h3>Discovery metadata</h3><p>Registries and capability descriptions make interfaces findable.</p></div>
</div>
<p class="microcopy">Tools expose operations · skills encode how to use them · protocols govern interaction. <a href="https://arxiv.org/html/2604.08224v1#S5">Zhou et al., §5 and Fig. 6.</a></p>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="11" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">Harness engineering</div>
<h2 id="the-harness-is-a-designed-cognitive-environment">The harness is a designed cognitive environment</h2>
<img class="architecture-image" src="assets/harness-cognitive-environment.svg" alt="A foundation model surrounded by memory, skills, protocols, permission, control, and observability within a harness" />
<p class="microcopy">Adapted from <a href="https://arxiv.org/html/2604.08224v1#S6">Zhou et al., Fig. 7 and §6.</a></p>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="12" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">Harness design</div>
<h2 id="six-dimensions-define-the-operating-envelope">Six dimensions define the operating envelope</h2>
<div class="grid six compact-six">
  <div class="card"><h3>Loop and control</h3><p>Steps, branches, recursion, termination, and costs.</p></div>
  <div class="card teal"><h3>Sandboxing</h3><p>Filesystem, network, state, and execution isolation.</p></div>
  <div class="card amber-border"><h3>Human oversight</h3><p>Approval gates, review points, and escalation triggers.</p></div>
  <div class="card"><h3>Observability</h3><p>Traces, metrics, causal links, errors, and outcomes.</p></div>
  <div class="card rose"><h3>Policy encoding</h3><p>Versioned permissions across user, project, and organization scopes.</p></div>
  <div class="card"><h3>Context budgets</h3><p>Retrieval, loading, compaction, eviction, and allocation.</p></div>
</div>
<p class="microcopy">Analytical framework from <a href="https://arxiv.org/html/2604.08224v1#S6.SS2">Zhou et al., §6.2.</a></p>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="13" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">At the model boundary</div>
<h2 id="the-harness-structures-model-inputand-output">The harness structures model input—and output</h2>
<div class="boundary-grid">
  <div class="boundary-label">INPUT</div>
  <div class="card teal"><h3>Memory</h3><p>Selected historical and situational context.</p><span class="tag teal-tag">contextual input</span></div>
  <div class="card amber-border"><h3>Skills</h3><p>Procedures, examples, heuristics, and constraints.</p><span class="tag amber">instructional input</span></div>
  <div class="boundary-model">LLM</div>
  <div class="card rose"><h3>Protocols</h3><p>Typed calls constrain the generative action space.</p><span class="tag rose-tag">action schema</span></div>
  <div class="boundary-label output">OUTPUT</div>
</div>
<p class="microcopy">Separation makes retrieval, procedure, and interface failures independently debuggable. <a href="https://arxiv.org/html/2604.08224v1#S7.SS2">Zhou et al., §7.2.</a></p>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="14" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">Architectural bridge</div>
<h2 id="coala-organized-cognition-externalization-locates-its-machinery">CoALA organized cognition; externalization locates its machinery</h2>
<div class="grid two bridge-cards">
  <div class="card"><span class="tag">CoALA · 2023/2024</span><h3>Functional vocabulary</h3><p>Memory modules, internal and external actions, and a decision cycle explain what a language agent does.</p></div>
  <div class="card teal"><span class="tag teal-tag">Externalization · 2026</span><h3>Systems partition</h3><p>Memory, skills, and protocols explain where state, expertise, and interaction structure live—and how the harness governs them.</p></div>
</div>
<p class="microcopy">Sources: <a href="https://arxiv.org/abs/2309.02427">Sumers et al., “Cognitive Architectures for Language Agents”</a> · <a href="https://arxiv.org/html/2604.08224v1">Zhou et al., “Externalization in LLM Agents.”</a></p>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="15" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">Multi-step reinforcement learning</div>
<h2 id="agentic-rl-trains-over-trajectoriesnot-single-responses">Agentic RL trains over trajectories—not single responses</h2>
<img class="rl-loop-image" src="assets/mai-agentic-rl-loop.svg" alt="Agentic reinforcement learning loop in which a policy model produces policy steps, an orchestration harness dispatches tool calls into a sandbox environment, observations return as environment steps, and the completed trajectory is graded for reward" />
<p class="microcopy">Adapted from <a href="https://www.alphaxiv.org/pdf/2606.mai-thinking-1v1">Microsoft AI Team, <em>MAI-Thinking-1</em>, Fig. 18 and §3.3, p. 40.</a></p>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="16" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">Harness reinforcement learning</div>
<h2 id="rl-can-operate-throughor-onthe-harness">RL can operate through—or on—the harness</h2>
<div class="grid two">
  <div class="card amber-border"><h3>RL through the harness</h3><p>The runtime owns the rollout while training changes the model policy that emits reasoning, tool calls, and final answers.</p></div>
  <div class="card teal"><h3>RL of the harness</h3><p>A controller learns structural choices—retrieve, branch, check, retry, compact, or stop—while the executor may remain frozen.</p></div>
</div>
<p class="microcopy">Sources: <a href="https://arxiv.org/abs/2608.17528">Agent Lightning v1.0</a> · <a href="https://arxiv.org/abs/2607.05458">Learning to Control LLM Agent Harnesses with Offline RL</a></p>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="17" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">Recursive Language Models</div>
<h2 id="an-rlm-turns-long-context-into-an-environment">An RLM turns long context into an environment</h2>
<div class="grid three">
  <div class="card amber-border"><h3>Externalize</h3><p>The full prompt becomes addressable data outside the root model’s immediate context.</p></div>
  <div class="card"><h3>Inspect and decompose</h3><p>Programmatic operations search, transform, and select bounded portions.</p></div>
  <div class="card teal"><h3>Recurse</h3><p>Language-model calls solve bounded subproblems whose results combine in code.</p></div>
</div>
<p class="microcopy">Source: <a href="https://arxiv.org/abs/2512.24601">Zhang, Kraska, and Khattab, “Recursive Language Models,” v3.</a></p>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="18" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">RLM mechanics</div>
<h2 id="two-mechanisms-keep-the-root-context-abstract">Two mechanisms keep the root context abstract</h2>
<img class="architecture-image" src="assets/rlm-offloading.svg" alt="Context is offloaded into symbolic variables and programmatic sub-agent calls keep task-specific intermediate results outside the root model context" />
<p class="microcopy">Adapted from <a href="https://alexzhang13.github.io/blog/2026/harness/">Zhang and Khattab, “Language model harnesses are compositional generalizers,” Fig. 5.</a></p>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="19" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">Harness as inductive bias</div>
<h2 id="reduce-unfamiliar-problems-to-familiar-model-calls">Reduce unfamiliar problems to familiar model calls</h2>
<img class="architecture-image" src="assets/locally-in-distribution.svg" alt="A complex out-of-distribution task is transformed by a structured harness into several small locally in-distribution observations for language-model calls" />
<p class="microcopy">Concept and early evidence: <a href="https://alexzhang13.github.io/blog/2026/harness/">Zhang and Khattab, “Language model harnesses are compositional generalizers,” Figs. 1–5.</a></p>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="20" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">From programmatic to symbolic</div>
<h2 id="an-rlm-is-already-a-partly-symbolic-harness">An RLM is already a partly symbolic harness</h2>
<div class="mapping-grid">
  <div class="mapping-head">RLM element</div><div class="mapping-head">Symbolic interpretation</div>
  <div>External prompt variable</div><div>Explicit, addressable state</div>
  <div>REPL variables</div><div>Persistent symbolic workspace</div>
  <div>Search, filter, map, reduce</div><div>Composable operators</div>
  <div>Recursive subcalls</div><div>Explicit task decomposition</div>
  <div>Function interfaces</div><div>Typed action boundaries</div>
  <div>Root-model trajectory</div><div>Program-level control structure</div>
</div>
<p class="microcopy">Our synthesis from the <a href="https://arxiv.org/abs/2512.24601">RLM architecture</a> and <a href="https://alexzhang13.github.io/blog/2026/harness/">harness-as-inductive-bias argument.</a></p>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="21" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">Symbolic and neurosymbolic harnesses</div>
<h2 id="make-the-harnesss-inductive-bias-explicit">Make the harness’s inductive bias explicit</h2>
<div class="symbolic-stack">
  <div class="stack-layer neural"><span class="tag amber">Neural model</span><strong>Interpret intent · propose decompositions · select actions</strong></div>
  <div class="stack-arrow">↓</div>
  <div class="stack-layer symbolic"><span class="tag teal-tag">Symbolic harness</span><strong>Typed state · operators · planners · constraints · invariants</strong></div>
  <div class="stack-arrow">↓</div>
  <div class="stack-layer verified"><span class="tag rose-tag">Verified environment</span><strong>Execute · observe · check · recover · audit</strong></div>
</div>
<p class="microcopy">Design synthesis; related example: <a href="https://arxiv.org/abs/2608.16794">Albinhassan et al., “Neurosymbolic Embodied Agents.”</a></p>
<footer>AI4C2 · Agentic AI for C2 Platforms</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="22" data-paginate="true" data-footer="AI4C2 · Agentic AI for C2 Platforms" data-theme="7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--footer:AI4C2 · Agentic AI for C2 Platforms;--theme:7c1h68xwze3m842vacmmrchyj538jprpif3lmw16q8sm;" data-marpit-pagination-total="23">
<div class="eyebrow">AI4C2 starting experiment</div>
<h2 id="compare-externalization-strategiesnot-only-models">Compare externalization strategies—not only models</h2>
<table>
<thead>
<tr>
<th>System</th>
<th>What is externalized</th>
<th>Research question</th>
</tr>
</thead>
<tbody>
<tr>
<td>Base LLM</td>
<td>Nothing beyond one assembled prompt</td>
<td>Where do quality and traceability degrade?</td>
</tr>
<tr>
<td>Retrieval workflow</td>
<td>Semantic memory and fixed retrieval policy</td>
<td>What is gained or lost through preselected evidence?</td>
</tr>
<tr>
<td>RLM harness</td>
<td>Context, workspace, decomposition, and subcalls</td>
<td>Does agent-directed decomposition improve evidence use?</td>
</tr>
<tr>
<td>Symbolic RLM variant</td>
<td>Plus typed state, operators, constraints, and checks</td>
<td>Which structures improve robustness and auditability?</td>
</tr>
</tbody>
</table>
<p class="microcopy">Public or synthetic C2-style artifacts · measures: quality, provenance, context cost, latency, failures, and recovery.</p>
