<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 350" role="img" aria-labelledby="title desc">
  <title id="title">Agentic loop and multi-step orchestration in reinforcement learning</title>
  <desc id="desc">A policy model emits a policy step. The orchestration harness produces a structured tool call, a dispatcher invokes a tool in a sandbox execution environment, and the resulting observation returns to the harness. The complete multi-step trajectory is graded to produce reward and credit assignment.</desc>
  <defs>
    <style>
      .lane{fill:#8891a1;font:11px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.08em}
      .title{fill:#1a1e28;font:600 17px ui-serif,"Iowan Old Style",Palatino,Georgia,serif}
      .compact{font-size:15px}
      .sub{fill:#5a6273;font:10.5px ui-monospace,"SF Mono",Menlo,Consolas,monospace}
      .small{fill:#5a6273;font:10px ui-monospace,"SF Mono",Menlo,Consolas,monospace}
      .edge{fill:#5a6273;font:10px ui-monospace,"SF Mono",Menlo,Consolas,monospace}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8891a1"/>
    </marker>
    <marker id="teal-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1f8272"/>
    </marker>
  </defs>

  <text x="22" y="24" class="lane">POLICY STEPS</text>
  <text x="22" y="180" class="lane">ENVIRONMENT STEPS</text>

  <g fill="none" stroke="#8891a1" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M188,84 L248,84"/>
    <path d="M426,84 L488,84"/>
    <path d="M666,84 L726,84"/>
  </g>
  <g class="edge">
    <text x="218" y="67" text-anchor="middle">response</text>
    <text x="457" y="67" text-anchor="middle">tool call</text>
    <text x="696" y="67" text-anchor="middle">dispatch</text>
  </g>

  <rect x="22" y="48" width="166" height="72" rx="11" fill="#fff" stroke="rgba(185,121,26,.45)"/>
  <text x="105" y="78" text-anchor="middle" class="title">Policy model</text>
  <text x="105" y="101" text-anchor="middle" class="sub">reason · act · finish</text>

  <rect x="248" y="48" width="178" height="72" rx="11" fill="#fff" stroke="#d4d9e2"/>
  <text x="337" y="78" text-anchor="middle" class="title">Policy step</text>
  <text x="337" y="101" text-anchor="middle" class="sub">model response</text>

  <rect x="488" y="36" width="178" height="96" rx="11" fill="rgba(185,121,26,.15)" stroke="rgba(185,121,26,.45)"/>
  <text x="577" y="70" text-anchor="middle" class="title compact">Orchestration harness</text>
  <text x="577" y="94" text-anchor="middle" class="sub">parse · maintain context</text>
  <text x="577" y="113" text-anchor="middle" class="sub">budget · terminate</text>

  <rect x="726" y="48" width="152" height="72" rx="11" fill="#fff" stroke="#d4d9e2"/>
  <text x="802" y="78" text-anchor="middle" class="title">Tool dispatcher</text>
  <text x="802" y="101" text-anchor="middle" class="sub">bind · invoke</text>

  <rect x="904" y="37" width="116" height="94" rx="11" fill="#fff" stroke="#1f8272"/>
  <text x="962" y="62" text-anchor="middle" class="small">AVAILABLE TOOLS</text>
  <line x1="920" y1="73" x2="1004" y2="73" stroke="#d4d9e2"/>
  <text x="962" y="91" text-anchor="middle" class="sub">shell · editor</text>
  <text x="962" y="110" text-anchor="middle" class="sub">database · API</text>
  <path d="M878,84 L904,84" fill="none" stroke="#1f8272" stroke-width="1.5" marker-end="url(#teal-arrow)"/>

  <rect x="726" y="196" width="294" height="68" rx="11" fill="#fff" stroke="#1f8272"/>
  <text x="873" y="225" text-anchor="middle" class="title">Sandbox execution environment</text>
  <text x="873" y="247" text-anchor="middle" class="sub">isolated state · tools · tests</text>
  <path d="M802,120 L802,196" fill="none" stroke="#8891a1" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="488" y="196" width="178" height="68" rx="11" fill="#fff" stroke="#1f8272"/>
  <text x="577" y="225" text-anchor="middle" class="title">Environment step</text>
  <text x="577" y="247" text-anchor="middle" class="sub">tool result / observation</text>
  <path d="M726,230 L666,230" fill="none" stroke="#1f8272" stroke-width="1.6" marker-end="url(#teal-arrow)"/>

  <path d="M577,196 C577,168 577,158 577,132" fill="none" stroke="#1f8272" stroke-width="1.6" marker-end="url(#teal-arrow)"/>
  <text x="590" y="169" class="edge">append to context</text>
  <path d="M488,230 C360,230 337,188 337,132" fill="none" stroke="#1f8272" stroke-width="1.6" marker-end="url(#teal-arrow)"/>
  <text x="385" y="218" class="edge">next turn</text>

  <rect x="22" y="294" width="998" height="42" rx="9" fill="#e6e9ef" stroke="#d4d9e2"/>
  <text x="42" y="320" class="small">COMPLETE TRAJECTORY</text>
  <text x="230" y="320" class="sub">policy steps + tool calls + observations</text>
  <text x="543" y="320" class="small">→ GRADERS</text>
  <text x="656" y="320" class="sub">tests · state checks · AI feedback</text>
  <text x="894" y="320" class="small">→ REWARD</text>
</svg>
