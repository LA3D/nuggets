          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "Now reveal the full architecture so the audience can recognize its components throughout the history.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-llm-wiki-architecture",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#4",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Explain the roles of raw sources, persistent synthesis, work products, and behavioral instructions in the LLM Wiki loop.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "Knowledge compounds when an agent repeatedly compiles recoverable evidence into a maintained artifact and files reviewed work back into it.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "Give away the system before the history. Raw is the independently recoverable source of truth. The wiki is the compiled, persistent artifact maintained by the agent. The schema or AGENTS.md is a behavioral contract for ingest, querying, citation, maintenance, and linting. Questions produce files, comparisons, diagrams, or slides that can be reviewed and filed back, so work compounds instead of disappearing into chat history.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "The wiki is not a replacement for raw evidence; it is a revisable synthesis whose claims must remain traceable to that evidence.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "For a newly encountered paper, what belongs in RAW, what belongs in WIKI, and what might be produced as WORK?",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Follow Karpathy’s linked “LLM Wiki” gist and Harrison Chase’s linked “Wiki Memory” essay.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "The architecture solves a continuity problem that becomes sharper in scientific work.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-scientific-continuity-problem",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#5",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Distinguish episodic model context from the cumulative state required by science.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "Scientific continuity must be preserved in an inspectable environment outside any single model invocation.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "Widen Karpathy’s practical observation into the scientific continuity problem. Research state includes evidence, failed attempts, critique, decisions, procedures, and uncertainty. The engineering task is to preserve that state across calls, sessions, agents, collaborators, and time.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "A long context window is not automatically institutional memory: it does not by itself provide durable ownership, revision history, provenance, or maintenance.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "Name three kinds of scientific state that should survive after the current model call ends.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "This is the deck’s conceptual framing; connect it backward to the LLM Wiki architecture and forward to the historical continuity systems.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "Ask which earlier knowledge systems already addressed parts of this problem.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-wikimemory-convergence",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#6",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Identify the three historical lineages that contribute to agentic WikiMemory.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "WikiMemory is a convergence of associative hypertext, collaborative wiki maintenance, and file-native personal knowledge—not a sudden invention.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "Read the three rows as complementary historical traditions, not one literal lineage. Memex was Bush’s imagined personal device for following associative trails; NLS/Augment was Engelbart’s integrated environment for structured text, links, tools, and collaboration; the read–write Web treats the Web as a medium people can both browse and edit. Wikis add shared maintenance. The “second brain” row adds personal ownership: in a Markdown vault, notes are nodes, links are edges, and metadata can type consequential relationships, so linked notes already form a knowledge graph. Agentic WikiMemory converges these affordances.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "The arrows organize related developments; they do not claim a single direct genealogy or that each later system consciously inherited every earlier design principle. A graph view is optional: linked notes already form a graph.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "What does Memex, NLS/Augment, the read–write Web, wiki maintenance, and the personal Markdown graph each contribute?",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Treat this as a synthesis map; the next sequence of slides supplies the historical evidence for each row.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "Start with Bush’s idea that associative trails matter more than filing hierarchies.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-bush-associative-trails",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#7",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Explain why Bush’s associative trail is more relevant to WikiMemory than a simple filing cabinet metaphor.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "An associative trail is a saved, revisit-able, branchable, and shareable path through sources, ideas, tensions, and questions—not merely a place to store them.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "In plain language, a trail records how inquiry moved: paper → supported claim → conflicting experiment → resulting question. Bush wrote amid concern that information was growing faster than people could organize and reuse it. His durable design principle was to preserve and pass on paths of association so scientific thought could continue; wiki links later provide a cheap, editable implementation.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "Bush did not describe the modern Web or modern AI; the Memex matters as an early framing of continuity through associative paths, not as a feature-by-feature prediction.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "Construct a four-step associative trail for a research question you know.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Follow the linked 1945 Vannevar Bush essay “As We May Think,” especially its discussion of associative indexing and trails.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "Engelbart expands the trail into an entire environment for augmented knowledge work.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-engelbarts-cognitive-environment",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#8",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Distinguish a hypertext feature from a whole cognitive environment for knowledge work.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "Augmentation emerges from the combination of structured information, tools, collaboration, views, and working procedures.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "Engelbart bridges the history to the harness framing. NLS/Augment was not merely an information store: it designed the surrounding cognitive environment and the procedures through which humans and tools worked together. Nelson’s Xanadu similarly treated relationships, versioning, transclusion, and provenance as first-class concerns.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "Hypertext is not only clickable text; its knowledge value depends on the larger environment and practices around the links.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "Which capabilities surrounding links make NLS/Augment a cognitive environment rather than a document viewer?",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Follow the linked Doug Engelbart Institute NLS/Augment overview and Project Xanadu history.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "Move from individual augmentation to CERN’s organizational continuity problem.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-web-continuity-problem",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#9",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Read Berners-Lee’s 1989 proposal and diagram as a response to organizational memory failure at CERN.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "The Web began as a way to preserve evolving relationships among people, projects, systems, and documents despite turnover and change.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "The proposal begins with high turnover, changing projects, duplicated effort, and technical information that had been recorded but could not be found. Berners-Lee says CERN’s observed working structure was a multiply connected web that evolved with time. The diagram is not a retrospective picture of websites; it maps the information-management problem the Web was meant to address. At this point the working name was “Mesh.”",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "The 1989 diagram is not merely a collection of web pages connected by generic hyperlinks.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "Point to one node type and one semantically meaningful relationship in the diagram.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Follow Berners-Lee’s linked 1989 proposal and the linked original W3C diagram; read the “Losing Information at CERN” and “Linked information systems” sections.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "Look more closely at the proposal’s data model: the nodes and the links both had types.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-web-typed-nodes-links",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#10",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Distinguish typed node categories and typed link predicates in the original Web proposal.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "Before the Web operated at planetary scale, its proposal described a flexible, distributed, machine-analyzable graph of heterogeneous entities and relationships.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "The proposal explicitly describes generic types of nodes and links, cross-system integration, personal annotations, and automatic analysis for anomalies and topology. This is richer than a collection of documents and anticipates the separation between a knowledge representation and the interfaces or agents that operate over it.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "Do not retroactively label the 1989 proposal RDF; it precedes RDF and does not specify the later formal model.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "Express one relationship from the original diagram as a subject–predicate–object triple.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Follow the linked proposal sections “Linked information systems,” “CERN Requirements,” and “Data analysis.”",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "Isolate the predicate itself and ask what changes when a link says why two things are connected.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-typed-links-why",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#11",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Compare a navigational hyperlink with a named relationship whose predicate can be explained, queried, and governed.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "A stable predicate such as supports, criticizes, or depends on turns connectivity into reusable intent.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "Brickley’s retrospective calls ordinary href semantics relatively meaningless because the relationship says only “links to.” His key move is to make the predicate a first-class, uniquely identified object. Once wrote, supports, or depends on has stable meaning, graph-pattern questions become possible and different systems can interpret the same edge consistently.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "A label alone does not make a link trustworthy; predicates still need shared definitions, provenance, validation, and governance. Also, Brickley labels the document a personal, informal interpretation rather than a formal W3C working-group publication.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "What question can a supports edge answer that an ordinary link cannot?",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Follow Dan Brickley’s linked 1999 “Nodes and Arcs” retrospective. Reserve its fuller nodes-and-arcs-to-RDF history for a future deck.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "Return from the semantic model to the human interface: the original Web client supported writing as well as reading.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-web-read-write-medium",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#12",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Explain the original Web’s read–write ambition and the later separation of browsing from editing.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "The first WorldWideWeb client was a browser-editor; wikis later recovered easy shared editing within the mainstream browser experience.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "Be precise: Berners-Lee invented the Web, not the wiki. The first client could follow links, create pages, and create links. As passive browsers spread, intuitive editing became separated from reading. Wikis later made shared editing simple in an ordinary browser.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "WikiWikiWeb did not invent read–write hypertext, although it made collaborative maintenance radically accessible.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "Which affordance did mainstream browsing lose that wikis later made ordinary again?",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Follow the linked 1989 client/server proposal, W3C history of the first WorldWideWeb client, and Berners-Lee’s 1997 “Realising the Full Potential of the Web.”",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "The wiki’s larger contribution was not merely editing; it was a social process for continuous knowledge maintenance.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-wiki-social-maintenance",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#13",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Explain wiki as a social and procedural system for continuous knowledge maintenance.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "A wiki is a corpus plus a culture of writing, linking, reviewing, and refactoring—not merely a markup syntax.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "The key shift is procedural. Openness lets readers repair; observability lets collaborators review; convergence reconciles duplication. “Incremental” is especially important because citing an unwritten page creates an affordance for future elaboration.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "Installing wiki software or using wiki syntax does not by itself create a maintained knowledge commons.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "Which wiki principle turns a missing page into useful future work, and how?",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Follow Ward Cunningham’s linked “Design Principles of Wiki.”",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "At social scale, link syntax must be joined by revision and governance infrastructure.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-wiki-collective-memory",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#14",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Explain how free links and revision infrastructure made links usable for collective memory.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "Arbitrary concept naming made knowledge easier to address, while history, watchlists, discussion, and revert made maintenance governable.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "Ward’s first wiki used WikiWords. Double-bracket free links later allowed arbitrary phrases to become page identities without distorting prose. MediaWiki surrounded those links with namespaces, backlinks, discussion, recent changes, watchlists, history, and revert.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "Double-bracket links were not part of the original WikiWikiWeb, and link syntax alone did not produce Wikipedia’s collective memory.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "Why does arbitrary link text matter, and which governance feature makes the resulting edits accountable?",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Follow the linked MediaWiki history and its account of the early Wikipedia toolchain.",
          "language": "en"
        },
        {
          "type": "TextualBody",

        },

        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "The agent can find related sources, create or repair links, flag contradictions, summarize what a trail means, and keep paths connected as new evidence arrives. It can also file its execution trajectory so later work can inspect prior attempts rather than restart from scratch. The human remains source selector, question asker, editor, and epistemic judge.",

        },

          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "Maintenance does not transfer scientific authority to the agent: it may propose, connect, and flag, but it must not silently promote guesses into trusted claims or eliminate human review.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",

    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-rag-vs-wikimemory",

        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Compare query-time retrieval with persistent, maintained synthesis without treating them as mutually exclusive.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "RAG grounds a response in retrieved evidence; WikiMemory preserves reusable synthesis, while retaining retrieval beneath it for verification and lost detail.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "Avoid the false binary. A strong architecture keeps raw evidence and may use search or RAG beneath the wiki. The wiki stores maintained entities, relationships, tensions, and synthesis. Retrieval grounds claims and restores details that compilation may discard. WiCER makes that compilation risk empirical.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "WikiMemory neither replaces RAG nor guarantees that compiled pages preserve every important fact.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "When a compiled page omits a critical experimental detail, which layer should recover it and which layer should be repaired afterward?",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Follow the linked WiCER paper, especially its compilation and evaluate–refine findings.",
          "language": "en"
        },

          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "Ask what structural affordances make a folder of files operable enough to support this maintenance loop.",
          "language": "en"
        }

    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-wiki-affordances",

          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Explain how identity, relations, metadata, scope, revision, and legibility turn files into an operable knowledge space.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "Wiki affordances make knowledge revisitable, traversable, selectable, reviewable, and directly repairable by both humans and agents.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "Stable pages provide addresses; links provide paths; metadata exposes status and provenance; hierarchy bounds scope; revision makes edits accountable; plain text keeps the artifact inspectable. Typed predicates add value when the distinction changes a query, validation rule, explanation, or workflow.",

        },

          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",

          "value": "Give one relation that deserves a typed predicate and one ordinary navigational link that does not.",

          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",

        },

          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",

        }

    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-index-context-budget",

      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#23",

        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Use index.md files as routing layers for progressive disclosure under a limited context budget.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "A hierarchy becomes agent-operable when each index cheaply reveals available scopes and lets context expand only where the task requires it.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "OKF permits index.md at any directory level. It groups links to concepts or subdirectories and recommends carrying each target’s short description, so a human or agent can see what is available before opening individual documents. The specification calls this progressive disclosure. Our harness interpretation is to survey, select, recursively expand, ground in raw sources when necessary, and stop when the task is sufficiently supported.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "An index is not an exhaustive table of contents that should always be loaded together with every descendant page.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "After reading a root index, what condition tells the agent to stop expanding rather than open another branch?",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Follow the linked Open Knowledge Format v0.2 specification, section 8 “Index files.”",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "Optionally move from hierarchical routing into the local typed neighborhood that an index helps reveal.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-wikimemory-neighborhood",

          "value": "Read the highlighted path as a Bush-style inquiry trail: paper-17 supports claim-7; run-042 contradicts it; the conflict motivates question-3; the question leads to revised run-043. Protocol-03 records how runs are tested. The concept note connects this neighborhood without swallowing its contestable assertions; those remain in claim notes where provenance, contradictions, maturity, and review can stay inspectable.",

          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",

          "purpose": "questioning",

          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Treat this as the deck’s design synthesis of Bush-style trails, typed links, note roles, and scientific provenance; route backward to slides 7 and 22 or forward to the claim-note and typed-edge slides.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "Optional route: zoom into the claim node to separate lifecycle maturity from epistemic status.",

        }

    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-wikimemory-page-anatomy",

      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#25",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Read an illustrative claim note that separates lifecycle maturity from epistemic status while preserving provenance, supporting and contradictory evidence, review timing, and next inquiry.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "A claim becomes inspectable when machine-readable relations and lifecycle fields remain paired with readable evidence, tensions, questions, and next actions.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "The example labels type, maturity, epistemic status, creator and creation context, supporting paper, contradictory run, and review timing. The prose sections then state the claim, evidence, tension, open question, and next inquiry. Keeping maturity separate from epistemic status prevents “well edited” from being mistaken for “well supported,” while typed relations keep both support and contradiction traversable.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "These fields are illustrative rather than a universal llm-wiki-colab schema, and structured frontmatter cannot turn an unsupported assertion into dependable knowledge.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "Optional exploration: which field should change after an editorial cleanup, which after contradictory evidence, and which after a successful replication?",
          "language": "en"
        },

    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-agentic-neighborhood-navigation",

        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",

          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",

        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "Treat notes as states and outgoing typed links as possible transitions. The task, current context, link meaning, provenance, and evidence status can weight which neighboring note is useful next. In the example, a query about challenges favors the contradicted_by edge to run-042, yielding a realized path through the graph. This framing connects to Markov-chain work while remaining implementation-neutral.",

          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "Optional exploration: for a replication-planning query, which outgoing relation should receive more weight, and what evidence-status signal could change that choice?",

          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",

          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",

        }
      ]

    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-harness-memory-system",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#27",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Apply the harness-externalization frame to a writable knowledge vault.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "Persistence comes from external files, but reliability comes from a harness that selects context, authorizes changes, validates evidence, observes outcomes, and can roll back.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "Files alone do not decide when an agent writes, which evidence is required, whether a change is accepted, or what must be preserved. Provenance keeps claims tied to sources; controlled write scopes and review bound authority; validation tests proposed changes; logs preserve actions and outcomes; rollback reverses changes that fail. Rules, skills, tools, permissions, and gates encode those responsibilities.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "A persistent folder is not automatically a dependable memory system, and a capable model cannot substitute for lifecycle governance or turn an unsupported guess into a trusted claim.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "Optional exploration: for an agent proposing to change a contested claim, name one responsibility at each of select, authorize, validate, observe, and rollback.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Follow Zhou et al.’s linked “Externalization in LLM Agents” and the linked “Living Wiki” treatment of vault schema as a procedural skill.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "Optional route: express a write as a governed graph change set and distinguish the generic plugin lifecycle from a stronger vault specialization.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-llm-wiki-colab-lifecycle",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#28",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Trace a WikiMemory write as a governed graph change set and distinguish llm-wiki-colab’s generic lifecycle from the vault /encode specialization.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "A dependable write integrates evidence across notes, links, indexes, logs, verification, authorization, and rollback rather than treating one edited file as the whole transaction.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "The common change-set pattern is to orient and deduplicate, route evidence to an appropriate note role, create or revise typed notes, repair consequential links, update the concept neighborhood plus index and log, verify provenance and structure, authorize and commit, then rebuild derived graph artifacts where the profile defines them. llm-wiki-colab provides a governed wiki lifecycle through orientation, skills, verification, logs, and Git coordination. The vault /encode lane is a stronger specialization with explicit type routing, separate maturity and epistemic state, creator/context provenance, reciprocal integration, review, commit, and RDF/SHACL rebuild.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "The two lanes do not share one universal schema: llm-wiki-colab is a portable governed lifecycle, while /encode adds repository-specific transaction semantics and derived-graph checks.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "Optional exploration: which steps belong to any governed wiki write, and which are specifically stronger commitments of the vault /encode profile?",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Follow the linked llm-wiki-colab repository and “Beyond Memory” for the generic lifecycle; treat the clearly labeled /encode lane as the author-supplied vault specialization rather than a claim about the plugin’s canonical schema.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "Optional route: zoom into typed-edge compilation as one method used inside a governed change set.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-typed-edge-compilation",
      "type": "Annotation",

        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Trace a readable relation from Markdown authoring through extraction, RDF representation, validation, and graph querying.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",

          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "This is progressive formalization. Page-level relations live in YAML; local claims can use a visible GitHub-wiki-compatible predicate annotation; an ordinary link is recorded as mentions. The extractor deduplicates the forms, maps them through a JSON-LD context, materializes inverse edges, validates with SHACL, and supports SPARQL queries such as supports-versus-criticizes.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "Authors and agents should not assert both directions of a relation; the build owns inverse edges so the two directions cannot silently disagree. Not every mention deserves promotion to a typed predicate.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "Where would you author a page-wide dependsOn relation, where would you author a local supports claim, and what does a plain link become?",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Follow the linked Edge-Types vocabulary and KG build pipeline in llm-wiki-colab.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "Typed edges are one method; skills make the wider scientific maintenance procedures explicit and executable.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-executable-wiki-skills",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#30",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Differentiate the epistemic obligations of source ingest, experiment filing, and corpus linting.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "Scientific maintenance becomes inspectable when distinct operations are encoded as explicit skills that converge on a shared verification gate.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "“The agent maintains the wiki” is too vague. Source ingest must integrate external evidence and provenance; experiment ingest must preserve configuration, metrics, comparison, surprise, negative results, code, and commit identity; linting diagnoses structural integrity. Writes integrate rather than append and may update the new page, existing claims, reciprocal links, the index, and the log.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "One generic maintenance prompt is not equivalent to procedures with different evidence obligations; wiki-lint is diagnostic first rather than permission to rewrite everything automatically.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "Which skill should record a negative experimental result, and what information must it preserve that a source summary need not?",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Follow the linked skills directory in llm-wiki-colab and inspect the shared Verification Gate delegated to by write procedures.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "These local project memories can remain owned by their projects while a federation makes expertise discoverable.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-federated-project-memory",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#31",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Explain how local project ownership and federated discovery can coexist.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "Projects should maintain their own source-of-truth wikis and publish honest capability metadata so peers can discover and consult expertise without copying every corpus into private context.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "Each organization member is a research-project repository paired with a curated wiki and a published Agent Card. The federation index supports discovery. Ask is a synchronous clone-and-consult operation; message is an asynchronous direct mailbox; post is a topical broadcast. Transparent file-based primitives connect expertise while memory stays with the project that owns it.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "Federation does not require centralizing all project wikis or treating an Agent Card as evidence that every claimed capability is correct.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "When should an agent use ask, message, or post, and where should the resulting durable knowledge ultimately be maintained?",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Follow the linked LA3D LLM Agents organization profile and federation index.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "Extend project-level federation into artifact-level federation: connect presentations, claims, publications, data, runs, and manifests without centralizing them.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-linked-research-artifacts",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#32",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Distinguish authoritative research objects from generated semantic projections and discovery catalogs, then explain how stable IRIs can connect them without centralizing their contents.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "Linked data can make a presentation, WikiMemory concepts and claims, publications, datasets, experiments, repository manifests, and discovery catalogs behave as one navigable knowledge space while each authoritative artifact remains with its owner.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "Start from the live W3C Web Annotation AnnotationPage embedded in this presentation. Its slide targets and learning bodies can point through stable IRIs to source-owned WikiMemory concept and claim pages. Those resources can carry qualified links to a DOI-identified publication, a licensed data object, and a versioned experiment or immutable commit. A generated repository manifest could prospectively describe ownership, scope, access, and endpoints; a federation catalog could index those manifests for discovery without copying every source corpus. Use Web Annotation for slide associations, PROV-O for derivation and activity lineage, SKOS for concept organization, CiTO for typed scholarly citation relations, Dublin Core Terms for broadly reusable descriptive metadata, and a small WikiMemory vocabulary only for missing operational concepts such as epistemic status, maturity, review, or procedure.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "The AnnotationPage and other semantic projections are not authoritative substitutes for the source presentation, wiki pages, publication, data, or run; a catalog is an index rather than a central knowledge base. This deck embeds its AnnotationPage now, but deployed WikiMemory repository manifests and their cross-project catalog are a prospective target architecture, not a claim about current deployments.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "Optional exploration: identify which nodes are authoritative sources, which are generated projections, and which are discovery infrastructure; then ask what stable identifier lets an agent return to the owning source.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Consult the W3C Web Annotation Data Model at https://www.w3.org/TR/annotation-model/, PROV-O at https://www.w3.org/TR/prov-o/, SKOS at https://www.w3.org/TR/skos-reference/, CiTO at https://www.sparontologies.net/ontologies/cito, and DCMI Metadata Terms at https://www.dublincore.org/specifications/dublin-core/dcmi-terms/; treat the manifest and catalog shapes as a design preview rather than an implemented standard.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "Follow one realized path through this linked space and ask how an agent loads only the neighborhood relevant to its task.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-follow-the-linked-neighborhood",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#33",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Trace an agent’s realized cross-artifact trail from a slide question to the owning evidence neighborhood and connect each step to task-conditioned graph navigation and a practical FAIR preview.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "An agent can follow stable identifiers and typed links to load the relevant local neighborhood, verify evidence and provenance, optionally consult another project, and file reviewed knowledge back without centralizing every artifact.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "Resolve the current slide through its Web Annotation, follow the concept or claim IRI to an owning repository manifest, load only the local graph neighborhood needed for the question, inspect evidence, versions, licenses, access rules, and provenance, then follow a cross-project link only if the task benefits from another owner’s neighborhood. The Markov-style analogy from the earlier navigation slide still applies: resources are states, typed links are possible transitions, and the task plus evidence context influences which transition is selected. The resulting sequence is a realized cross-artifact trail, not a demand to copy all projects into one model context. FAIR provides a preview of the obligations around that trail: stable identifiers and catalogs support findability; standard protocols with authentication support accessibility; JSON-LD and shared vocabularies support interoperability; provenance, versions, licenses, epistemic status, and community standards support reuse.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "JSON-LD syntax alone does not make an artifact FAIR, a discoverable identifier does not imply public access, and a shared catalog does not authorize an agent to ingest private knowledge. Shared semantics, access controls, provenance, licensing, review, and governance remain necessary; the owning-manifest step is prospective in this architecture.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "Optional exploration: for a question about contradictory evidence, which typed transition should the agent prefer, what access and provenance signals must it inspect before loading the next neighborhood, and when should it stop rather than consult another project?",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Use the FAIR Guiding Principles at https://doi.org/10.1038/sdata.2016.18 and W3C Data on the Web Best Practices at https://www.w3.org/TR/dwbp/ for the practical obligations; use Web Annotation, PROV-O, SKOS, CiTO, and DCMI Terms for established association, provenance, concept, citation, and descriptive semantics, reserving a small WikiMemory vocabulary for epistemic status, maturity, review, and procedures.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "Return from this linked-data preview to the wider 2026 WikiMemory field and see which system dimensions current work is beginning to fill.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-wikimemory-research-field",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#34",

        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",

        {

          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",

        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "The term is no longer only a viral pattern. Work appearing between April and August 2026 addresses persistent representation, compilation loss and refinement, navigation and downstream learning, provenance and revision, and the conversion of experience into reusable procedure. The composition matters more than declaring one winning architecture.",
          "language": "en"

          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",

          "value": "Match WiCER, TrajWiki, and WikiSkill to the primary system dimension each contributes.",

        }

    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-memory-entrenchment-risk",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#35",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Explain how an agent-maintained wiki can entrench weak claims and identify controls that interrupt the loop.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "Persistence and centrality can amplify an unsupported claim when concept synthesis drops qualifications and later agents treat links as authority.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "The failure chain is explicit: a weak source supports an inadequately qualified claim; concept synthesis loses the caveat; the concept page becomes central; later agents repeat it and reinforce the same neighborhood. Controls map to the chain: claim-level provenance and contradictory evidence expose weak support; separate maturity and epistemic status plus scheduled review keep uncertainty visible; supersession and controlled writes preserve revision; evaluation detects downstream repetition; rollback reverses harmful changes.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "A mature, central, or frequently traversed note is not necessarily true, and a concept note must not absorb contested assertions without their provenance and contradictions.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "Optional exploration: choose one arrow in the error loop and name the control that would detect, interrupt, or reverse it before the next agent repeats the claim.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Follow the linked “Memory as Metabolism” discussion of entrenchment and contradictory evidence and TrajWiki’s immutable snapshots with ADD, REVISE, and DEPRECATE operations.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "Optional route: with these controls in place, examine how trajectories can be distilled into candidate procedures without treating the distillation as automatically trustworthy.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-wikiskill-learning-loop",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#36",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Distinguish an intellectual trail from an execution trajectory, then trace how trajectories are distilled and validated as candidate procedures.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "A persistent wiki can help procedures evolve, but distilled experience becomes dependable knowledge only after an outer-loop harness validates it on tasks and can roll it back.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "An intellectual trail records movement through evidence and ideas; an execution trajectory records what an agent tried, which tools or steps it used, and the resulting outcomes and failures. Both preserve continuity, but they are different artifacts. The wiki can distill raw trajectories into candidate reusable lessons, instructions, and resources. Task-level evaluation must then demonstrate improvement, record outcomes, and roll back candidates that fail.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "A trajectory, plausible wiki summary, or well-written candidate skill is not itself a dependable procedure; distillation can erase context or promote a coincidental success unless validation tests the resulting behavior.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "Why is rollback necessary, and what evidence should the acceptance gate inspect?",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Follow Tang et al.’s linked WikiSkill preprint, especially the ablations on persistent knowledge and cross-model skill transfer; compare this execution path with Bush’s associative trail as a continuity analogy, not a prediction of AI.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "Generalize from learned procedures to a definition of scientific memory that preserves evidence, knowledge, and contestable method.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-scientific-wikimemory-definition",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#37",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Define Scientific WikiMemory as a layered relationship among recoverable evidence, maintained knowledge, and validated procedure.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "Scientific memory must preserve why claims are believed or doubted so conclusions remain traceable, revisable, and contestable.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "Raw evidence includes papers, data, code, runs, and conversations that remain immutable or independently recoverable. Wiki knowledge maintains claims, entities, methods, tensions, provenance, and revision. Scientific procedures operationalize that knowledge as workflows, checks, skills, and decision protocols that can be tested and inspected.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "A conclusion-only second brain is not sufficient for science; provenance, negative results, uncertainty, competing interpretations, reproducibility, and human judgment are core memory semantics rather than optional metadata.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "Where should a negative result live in the three-layer stack, and how should it affect an existing claim and procedure?",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "This is the deck’s proposed synthesis; route backward to raw/wiki/work, harness externalization, entrenchment controls, and WikiSkill.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "End by turning the definition into an empirical and governance research agenda.",
          "language": "en"
        }
      ]
    },
    {
      "id": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#annotation-sai-research-agenda",
      "type": "Annotation",
      "motivation": "describing",
      "target": "https://la3d.github.io/nuggets/projects/sai/updates/2026-08-31/#38",
      "body": [
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#learningObjective",
          "value": "Translate WikiMemory’s promise into testable research questions about representation, compilation, retrieval, maintenance, governance, and evaluation.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#coreClaim",
          "value": "Scientific trustworthiness is an empirical and governance program, not a product feature conferred by using Markdown, graphs, or agents.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "describing",
          "value": "Close with a research program rather than a product pitch. A concrete next experiment is to build a scientific WikiMemory profile, compare it with a RAG-only baseline, and evaluate provenance, answer quality, context cost, recovery from error, and visibility of failure.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#misconception",
          "value": "The deck has not established that WikiMemory is already scientifically trustworthy; it has motivated the architecture and the questions required to test it.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "questioning",
          "value": "Which research question should be tested first, and what observable metric would distinguish improvement from hidden failure?",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#sourceRoute",
          "value": "Use the preceding field map and risk slides to design the evaluation; the six cards define the agenda’s major dimensions.",
          "language": "en"
        },
        {
          "type": "TextualBody",
          "purpose": "https://la3d.github.io/nuggets/ns/agentic-learning/#transition",
          "value": "Invite the audience to choose a first experiment through which scientists and agents can learn together.",
          "language": "en"
        }
      ]
    }
  ]
}

</head><body><svg data-marpit-svg="" viewBox="0 0 1080 700"><foreignObject width="1080" height="700"><section id="1" data-paginate="true" data-footer="SAI · Scientific AI" data-class="title" data-theme="zsyk7fex7knekhdo2bteq9gh0hfdg4seu9dcb20uqb9h" lang="C" class="title" data-marpit-pagination="1" style="--paginate:true;--footer:SAI · Scientific AI;--class:title;--theme:zsyk7fex7knekhdo2bteq9gh0hfdg4seu9dcb20uqb9h;" data-marpit-pagination-total="38"><div class="eyebrow">SAI · Scientific AI</div>
